version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # ── PUT YOUR SNOWFLAKE CREDENTIALS HERE ──────────────────────────────
    SNOWFLAKE_ACCOUNT: lbtguwz-xo18875     
    SNOWFLAKE_USER: KISHORE 
    SNOWFLAKE_PASSWORD: SVSBabu#19781983
    SNOWFLAKE_DATABASE: retail_anomaly_db
    SNOWFLAKE_SCHEMA: analytics
    SNOWFLAKE_WAREHOUSE: retail_wh
    SNOWFLAKE_ROLE: ACCOUNTADMIN           
    # ─────────────────────────────────────────────────────────────────────
    _PIP_ADDITIONAL_REQUIREMENTS: >
      snowflake-connector-python==3.10.0
      pandas==2.2.2
      great-expectations==0.18.15
      sqlalchemy==1.4.52
      snowflake-sqlalchemy==1.5.3
  volumes:
    - ./dags:/opt/airflow/dags
    - ./tasks:/opt/airflow/tasks
    - ./data:/opt/airflow/data
    - ./great_expectations:/opt/airflow/great_expectations
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
